<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>10 сцен из жидкого стекла - RaptorAI</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080B0F;color:#F0F4F8;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1240px;margin:0 auto;padding:46px 24px 10px}
header h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
header p{margin-top:8px;color:#8899AA;font-size:16px;line-height:1.6;max-width:820px}
.grid{max-width:1240px;margin:0 auto;padding:20px 24px 80px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.box{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:radial-gradient(55% 55% at 50% 50%,rgba(0,212,255,.07),rgba(140,123,255,.04) 55%,transparent),#080B0F;border:1px solid #141c25;cursor:pointer}
.box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{display:flex;gap:12px;align-items:baseline;margin-top:14px}
.cap b{font:700 15px/1 'Inter',sans-serif;color:#5CFFC8}
.cap span{font-size:17px;font-weight:700}
.cap em{display:block;font-style:normal;color:#8899AA;font-size:14px;margin-top:6px;line-height:1.5}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>10 сцен из жидкого стекла</h1>
  <p>Тот же материал, что сейчас на главной, но каждая сцена про нашу работу. Все реагируют на курсор, по клику - свой эффект. Назовите номер.</p>
</header>
<div class="grid" id="grid"></div>
<script>
(function(){
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var L=[
 ['Сообщение собирается','Капли сливаются в облачко чата с бегущими точками «печатает», потом снова рассыпаются.'],
 ['Заявки стекаются','Капли-заявки со всех сторон по спирали втекают в одно ядро: всё в одном месте.'],
 ['Связанные системы','Четыре узла соединены стеклянными нитями, по ним бегут капли-данные. Как сценарий автоматизации.'],
 ['Воронка','Капли падают в стеклянную воронку, а снизу выходит одна чистая - квалифицированная заявка.'],
 ['ИИ-ядро','Живое ядро втягивает капли-вопросы и выпускает их обратно.'],
 ['Шестерёнка','Стеклянная шестерёнка автоматизации вращается, вокруг кружат капли.'],
 ['Молния','Стеклянная молния - ответ за секунды. Медленно поворачивается.'],
 ['Готово','Стеклянная галочка в кольце, по кольцу бежит капля.'],
 ['До и после','Неровные капли проходят через кольцо и выходят идеально гладкими: хаос превращается в порядок.'],
 ['Работает 24/7','Стеклянное кольцо-циферблат, по нему без остановки бежит капля со шлейфом.']
];
var grid=document.getElementById('grid');
L.forEach(function(x,i){grid.insertAdjacentHTML('beforeend','<div><div class="box" id="b'+i+'"><canvas></canvas></div><div class="cap"><b>'+(i<9?'0':'')+(i+1)+'</b><div><span>'+x[0]+'</span><em>'+x[1]+'</em></div></div></div>')});

var PRE=[
'precision highp float;uniform vec2 R;uniform float T,C;uniform vec2 M;',
'vec3 pal(float t){vec3 a=vec3(0.,.83,1.),b=vec3(.55,.48,1.),c=vec3(1.,.48,.88),d=vec3(.36,1.,.78);',
' t=fract(t);return t<.25?mix(a,b,t*4.):t<.5?mix(b,c,(t-.25)*4.):t<.75?mix(c,d,(t-.5)*4.):mix(d,a,(t-.75)*4.);}',
'float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}',
'mat2 r2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}',
'vec3 h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(vec3(p.x*p.y*p.z,p.x+p.y*p.z,p.x*p.y+p.z));}',
'float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h3(i).x,h3(i+vec3(1,0,0)).x,f.x),mix(h3(i+vec3(0,1,0)).x,h3(i+vec3(1,1,0)).x,f.x),f.y),mix(mix(h3(i+vec3(0,0,1)).x,h3(i+vec3(1,0,1)).x,f.x),mix(h3(i+vec3(0,1,1)).x,h3(i+vec3(1,1,1)).x,f.x),f.y),f.z);}',
'float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}',
'float sdSeg2(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}',
'float sdRBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}',
'float sdTor(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}',
'void ed(vec2 p,vec2 a,vec2 b,inout float d,inout float s){vec2 e=b-a,w=p-a;vec2 q=w-e*clamp(dot(w,e)/dot(e,e),0.,1.);d=min(d,dot(q,q));bvec3 c=bvec3(p.y>=a.y,p.y<b.y,e.x*w.y>e.y*w.x);if(all(c)||all(not(c)))s*=-1.;}',
'float map(vec3 p);',
'float scene(vec3 p){p.xz*=r2(M.x*.55);p.yz*=r2(-M.y*.4);return map(p);}',
'vec3 nor(vec3 p){vec2 e=vec2(.0015,0);return normalize(vec3(scene(p+e.xyy)-scene(p-e.xyy),scene(p+e.yxy)-scene(p-e.yxy),scene(p+e.yyx)-scene(p-e.yyx)));}',
'void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec3 ro=vec3(0,0,4.6),rd=normalize(vec3(uv,-1.55));',
' float b=dot(ro,rd),h0=b*b-dot(ro,ro)+5.3;if(h0<0.){gl_FragColor=vec4(0.);return;}',
' float t=max(0.,-b-sqrt(h0)),mh=1e5,mt=0.;bool hit=false;',
' for(int i=0;i<90;i++){float h=scene(ro+rd*t);if(h<mh){mh=h;mt=t;}if(h<.0008){hit=true;break;}t+=h*.9;if(t>9.)break;}',
' float px=2.2/R.y*mt*.62;float a=hit?1.:1.-smoothstep(0.,px,mh);if(a<.003){gl_FragColor=vec4(0.);return;}',
' vec3 p=ro+rd*(hit?t:mt),n=nor(p),v=-rd;vec3 L=normalize(vec3(-.6,.8,.7)),L2=normalize(vec3(.8,-.35,.5));',
' float df=max(dot(n,L),0.),fr=pow(1.-max(dot(n,v),0.),2.2),sp=pow(max(dot(reflect(-L,n),v),0.),80.),sp2=pow(max(dot(reflect(-L2,n),v),0.),22.);',
' vec3 f=pal(dot(n,v)*.85+n.y*.25+T*.025);',
' vec3 col=vec3(.035,.045,.07)+f*(.2+.32*df)+f*fr*1.1+vec3(1.)*sp*.95+pal(T*.025+.5)*sp2*.28;',
' gl_FragColor=vec4(col,a);}'
].join('\n');

var F=[];
F[0]='float map(vec3 p){float k=smoothstep(.2,.8,.5+.5*sin(T*.5))*(1.-C*.9);\n'+
' float bx=sdRBox(p-vec3(0.,.15,0.),vec3(1.05,.62,.26),.26);bx=smin(bx,sdCap(p,vec3(-.5,-.3,0.),vec3(-.85,-.82,0.),.12),.2);\n'+
' float dt=1e5;for(int i=0;i<3;i++){float x=-.42+float(i)*.42;dt=min(dt,length(p-vec3(x,.15+.06*sin(T*5.-float(i)*1.3),.28))-.13);}\n'+
' bx=smin(bx,dt,.05);\n'+
' float s=1e5;for(int i=0;i<5;i++){float fi=float(i);vec3 c=vec3(sin(T*.4+fi*1.7)*1.1,cos(T*.33+fi*2.3)*.75,sin(T*.27+fi)*.3);s=smin(s,length(p-c)-(.3+.05*sin(fi*3.)),.35);}\n'+
' return mix(s,bx,k);}';
F[1]='float map(vec3 p){float d=length(p)-(.42+.04*sin(T*2.)+C*.15);\n'+
' for(int i=0;i<9;i++){float fi=float(i);float f=fract(T*.16+fi/9.);float a=fi*2.4+f*2.5;float r=1.75*(1.-f*f);\n'+
'  vec3 c=vec3(cos(a)*r,sin(a)*r*.7,sin(a*1.3)*.3*r);d=smin(d,length(p-c)-.15*smoothstep(0.,.12,f),.32);}\n'+
' return d;}';
F[2]='float map(vec3 p){p.xy*=r2(sin(T*.25)*.15);vec3 A=vec3(-1.1,.55,0.),B=vec3(1.05,.7,.1),Q=vec3(.95,-.65,-.1),D=vec3(-.9,-.7,.15);\n'+
' float s=.3+C*.06;float d=min(min(length(p-A),length(p-B)),min(length(p-Q),length(p-D)))-s;\n'+
' float l=min(min(sdCap(p,A,B,.045),sdCap(p,B,Q,.045)),min(sdCap(p,A,D,.045),sdCap(p,D,Q,.045)));d=smin(d,l,.18);\n'+
' float f=fract(T*.35);d=smin(d,length(p-mix(A,B,f))-.11,.12);d=smin(d,length(p-mix(D,Q,fract(f+.5)))-.11,.12);d=smin(d,length(p-mix(B,Q,fract(f+.25)))-.1,.12);d=smin(d,length(p-mix(A,D,fract(f+.7)))-.1,.12);\n'+
' return d;}';
F[3]='float map(vec3 p){p.yz*=r2(.28);vec2 q=vec2(length(p.xz),p.y);\n'+
' float d=min(sdSeg2(q,vec2(1.05,.8),vec2(.21,-.1)),sdSeg2(q,vec2(.21,-.1),vec2(.21,-.72)))-.065;\n'+
' for(int i=0;i<5;i++){float fi=float(i);float f=fract(T*.26+fi/5.);vec3 c;\n'+
'  if(f<.55){float u=f/.55;c=vec3(sin(fi*2.1)*.72*(1.-u*.85),1.55-u*1.35,cos(fi*2.1)*.42*(1.-u*.85));}else{float u=(f-.55)/.45;c=vec3(0.,.2-u*1.9,0.);}\n'+
'  d=smin(d,length(p-c)-.12*(1.+C*.5),.12);}\n'+
' return d;}';
F[4]='float map(vec3 p){float d=length(p)-.55-.05*sin(p.x*5.+T*1.5)*sin(p.y*5.-T)*sin(p.z*5.+T*.7)-C*.12;\n'+
' for(int i=0;i<6;i++){float fi=float(i);float a=T*(.6+fi*.07)+fi*1.05;float r=.95+.45*sin(T*.7+fi*1.9)+C*.5;\n'+
'  vec3 c=vec3(cos(a)*r,sin(a)*r*sin(fi*1.1+.6),sin(a)*r*cos(fi*1.1+.6));d=smin(d,length(p-c)-.16,.38);}\n'+
' return d;}';
F[5]='float map(vec3 p){vec3 q=p;q.xz*=r2(.35);q.xy*=r2(T*.35+C*3.);float a=atan(q.y,q.x),r=length(q.xy);\n'+
' float tooth=smoothstep(-.25,.25,cos(a*9.))*.17;float d2=max(r-(.8+tooth),-(r-.3));\n'+
' float d=(max(d2,abs(q.z)-.16)-.06)*.8;\n'+
' for(int i=0;i<3;i++){float fi=float(i);float b=-T*.6+fi*2.09;vec3 c=vec3(cos(b)*1.35,sin(b)*1.35,sin(b*2.+fi)*.25);d=smin(d,length(p-c)-.15,.2);}\n'+
' return d;}';
F[6]='float map(vec3 p){p.xz*=r2(sin(T*.6)*.6+C*6.28);vec2 q=p.xy*1.05;float d=1e9,s=1.;\n'+
' vec2 v0=vec2(-.1,1.15),v1=vec2(.62,1.15),v2=vec2(.18,.22),v3=vec2(.66,.22),v4=vec2(-.42,-1.2),v5=vec2(-.02,-.12),v6=vec2(-.5,-.12);\n'+
' ed(q,v0,v1,d,s);ed(q,v1,v2,d,s);ed(q,v2,v3,d,s);ed(q,v3,v4,d,s);ed(q,v4,v5,d,s);ed(q,v5,v6,d,s);ed(q,v6,v0,d,s);\n'+
' float pd=s*sqrt(d);vec2 w=vec2(pd,abs(p.z)-.1);float b=(min(max(w.x,w.y),0.)+length(max(w,0.))-.07)*.9;\n'+
' for(int i=0;i<2;i++){float fi=float(i);float a=T*.8+fi*3.14;b=smin(b,length(p-vec3(cos(a)*1.3,sin(a)*.9,sin(a)*.4))-.14,.15);}\n'+
' return b;}';
F[7]='float map(vec3 p){p.xz*=r2(sin(T*.5)*.45);float s=1.+C*.12;\n'+
' float d=smin(sdCap(p,vec3(-.55,.05,0.)*s,vec3(-.15,-.4,0.)*s,.17),sdCap(p,vec3(-.15,-.4,0.)*s,vec3(.68,.52,0.)*s,.17),.1);\n'+
' float ring=sdTor(vec3(p.x,p.z,p.y),vec2(1.2,.065));d=min(d,ring);\n'+
' float a=T*.9;d=smin(d,length(p-vec3(cos(a)*1.2,sin(a)*1.2,0.))-.15,.2);\n'+
' return d;}';
F[8]='float map(vec3 p){p.xz*=r2(-.35);float d=sdTor(p.yxz,vec2(.66,.075));\n'+
' for(int i=0;i<4;i++){float fi=float(i);float x=-2.1+fract(T*.17+fi/4.)*4.2;vec3 c=p-vec3(x,.0,0.);\n'+
'  float rough=smoothstep(.35,-.35,x);c.y*=1.+rough*.35*sin(T*2.+fi);\n'+
'  float s=length(c)-.3+rough*(n3(c*3.+T*.6+fi)-.5)*.35;d=smin(d,s*.8,.18);}\n'+
' return d;}';
F[9]='float map(vec3 p){p.yz*=r2(.38);float ang=atan(p.y,p.x);\n'+
' float d=sdTor(vec3(p.x,p.z,p.y),vec2(1.05,.12+.02*sin(ang*12.+T*3.)));\n'+
' float a=-T*(1.2+C*3.);d=smin(d,length(p-vec3(cos(a)*1.05,sin(a)*1.05,0.))-.24,.25);\n'+
' for(int i=1;i<4;i++){float fi=float(i);float b=a+fi*.32;d=smin(d,length(p-vec3(cos(b)*1.05,sin(b)*1.05,0.))-(.2-fi*.04),.2);}\n'+
' d=min(d,length(p)-.2-.03*sin(T*3.));\n'+
' return d;}';

var tiles=[];
F.forEach(function(src,i){
  var box=document.getElementById('b'+i),cv=box.querySelector('canvas'),gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:false});
  if(!gl)return;
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error('scene '+(i+1)+': '+gl.getShaderInfoLog(o));return o}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,PRE+'\n'+src));gl.linkProgram(pr);gl.useProgram(pr);
  var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  var U={R:gl.getUniformLocation(pr,'R'),T:gl.getUniformLocation(pr,'T'),C:gl.getUniformLocation(pr,'C'),M:gl.getUniformLocation(pr,'M')};
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  var st={mx:0,my:0,cx:0,cy:0,c:0,vis:false};
  box.addEventListener('pointermove',function(e){var r=box.getBoundingClientRect();st.mx=(e.clientX-r.left)/r.width*2-1;st.my=-((e.clientY-r.top)/r.height*2-1)});
  box.addEventListener('pointerleave',function(){st.mx=0;st.my=0});
  box.addEventListener('click',function(){st.c=1});
  new IntersectionObserver(function(es){st.vis=es[0].isIntersecting},{rootMargin:'80px'}).observe(box);
  function size(){var d=Math.min(devicePixelRatio||1,1.15),s=box.clientWidth;cv.width=s*d;cv.height=s*d;gl.viewport(0,0,cv.width,cv.height)}
  size();addEventListener('resize',size);
  st.draw=function(t){var cc=st.c*st.c*(3-2*st.c);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform2f(U.R,cv.width,cv.height);gl.uniform1f(U.T,t);gl.uniform1f(U.C,cc);gl.uniform2f(U.M,st.cx,st.cy);gl.drawArrays(gl.TRIANGLES,0,3)};
  tiles.push(st);
});
var t0=performance.now();
(function f(now){requestAnimationFrame(f);var t=reduce?4:(now-t0)/1000;
  tiles.forEach(function(st){st.cx+=(st.mx-st.cx)*.06;st.cy+=(st.my-st.cy)*.06;st.c=Math.max(0,st.c-.012);if(st.vis)st.draw(t)});
})(t0);
})();
</script>
</body>
