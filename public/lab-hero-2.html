<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>10 концептов первого экрана - RaptorAI</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080B0F;color:#F0F4F8;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1240px;margin:0 auto;padding:46px 24px 10px}
header h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
header p{margin-top:8px;color:#8899AA;font-size:16px}
.grid{max-width:1240px;margin:0 auto;padding:20px 24px 80px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.tile{position:relative}
.box{position:relative;aspect-ratio:1/1;border-radius:22px;overflow:hidden;background:#080B0F;border:1px solid #141c25}
.box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{display:flex;gap:12px;align-items:baseline;margin-top:14px}
.cap b{font:700 15px/1 'JetBrains Mono',monospace;color:#5CFFC8}
.cap span{font-size:17px;font-weight:700}
.cap em{display:block;font-style:normal;color:#8899AA;font-size:14px;margin-top:6px;line-height:1.5}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>10 концептов для первого экрана</h1>
  <p>Только абстрактные 3D-формы, без устройств и интерфейсов. Каждый реагирует на курсор, по клику - отдельный эффект. Назовите номер.</p>
</header>
<div class="grid" id="grid"></div>

<script>
(function(){
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
var L = [
 ['Шёлковая лента','Широкая светящаяся лента плавно закручивается в пространстве, рядом две тонкие.'],
 ['Слияние капель','Пять стеклянных капель перетекают друг в друга. Одна следует за курсором.'],
 ['Мыльный пузырь','Идеально круглый прозрачный пузырь, по плёнке бегут переливы.'],
 ['Галактика','Спиральная галактика в цветах сайта медленно вращается, мерцают звёзды.'],
 ['Океан света','Волны из светящихся линий уходят к горизонту.'],
 ['Цветная сфера','Мягкий шар, внутри которого перетекают цвета, как в жидкости.'],
 ['Призма','Луч входит в стеклянную призму и выходит веером цветов: хаос на входе, порядок на выходе.'],
 ['Чернила в воде','Цветные чернила медленно клубятся и закручиваются.'],
 ['Кристалл','Гранёный кристалл вращается, грани ловят свет и переливаются.'],
 ['Поток','Тысячи частиц текут по невидимым течениям, курсор закручивает их в воронку.']
];
var grid=document.getElementById('grid');
L.forEach(function(x,i){grid.insertAdjacentHTML('beforeend','<div class="tile"><div class="box" id="b'+i+'"><canvas></canvas></div><div class="cap"><b>'+(i+1<10?'0':'')+(i+1)+'</b><div><span>'+x[0]+'</span><em>'+x[1]+'</em></div></div></div>')});

var PRE=[
'precision highp float;uniform vec2 R;uniform float T,C;uniform vec2 M;',
'const vec3 BG=vec3(.031,.043,.059);',
'vec3 h3(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(vec3(p.x*p.y*p.z,p.x+p.y*p.z,p.x*p.y+p.z));}',
'float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);',
' return mix(mix(mix(h3(i).x,h3(i+vec3(1,0,0)).x,f.x),mix(h3(i+vec3(0,1,0)).x,h3(i+vec3(1,1,0)).x,f.x),f.y),',
'  mix(mix(h3(i+vec3(0,0,1)).x,h3(i+vec3(1,0,1)).x,f.x),mix(h3(i+vec3(0,1,1)).x,h3(i+vec3(1,1,1)).x,f.x),f.y),f.z);}',
'float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<5;i++){s+=a*n3(p);p*=2.02;a*=.5;}return s;}',
'float fbm2(vec2 p){return fbm(vec3(p,1.7));}',
'mat2 r2(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}',
'float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
'vec3 pal(float t){vec3 a=vec3(0.,.83,1.),b=vec3(.55,.48,1.),c=vec3(1.,.48,.88),d=vec3(.36,1.,.78);',
' t=fract(t);return t<.25?mix(a,b,t*4.):t<.5?mix(b,c,(t-.25)*4.):t<.75?mix(c,d,(t-.5)*4.):mix(d,a,(t-.75)*4.);}',
'float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}',
'vec3 shade(vec3 n,vec3 v,float k){vec3 L=normalize(vec3(-.6,.8,.7)),L2=normalize(vec3(.8,-.3,.5));',
' float df=max(dot(n,L),0.),fr=pow(1.-max(dot(n,v),0.),2.2),sp=pow(max(dot(reflect(-L,n),v),0.),70.),sp2=pow(max(dot(reflect(-L2,n),v),0.),24.);',
' vec3 f=pal(dot(n,v)*.9+n.y*.25+k);return vec3(.04,.05,.08)+f*(.24+.34*df)+f*fr*1.05+vec3(1.)*sp*.9+pal(k+.5)*sp2*.3;}'
].join('\n');

var F=[];
/* 1 шёлковая лента */
F[0]='void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec3 col=BG;\n'+
'for(int i=0;i<3;i++){float fi=float(i);float x=uv.x*1.1;\n'+
' float y=.2*sin(x*1.7+T*.32+fi*1.9)+.07*sin(x*3.3-T*.45+fi)+(fi-1.)*.15+M.y*.05*(fi+1.);\n'+
' float tw=x*2.3+T*.55+fi*2.1+M.x*.9+C*3.;float w=(i==1?.15:.045)*abs(cos(tw))+.003;\n'+
' float d=abs(uv.y-y);float a=1.-smoothstep(w*.75,w,d);float sh=.48+.62*pow(abs(sin(tw)),.7);\n'+
' vec3 c=pal(x*.17+fi*.19+T*.025);float rim=smoothstep(w*.4,w*.95,d)*a;\n'+
' col=mix(col,c*sh+rim*.35*c,a*.95);col+=c*exp(-d*16.)*.07;}\n'+
'col*=smoothstep(1.05,.35,abs(uv.x))*.85+.15;gl_FragColor=vec4(col,1.);}';
/* 2 слияние капель */
F[1]='float map(vec3 p){float d=1e5;for(int i=0;i<5;i++){float fi=float(i);\n'+
' vec3 c=vec3(sin(T*.37+fi*1.7)*.85,cos(T*.29+fi*2.3)*.55,sin(T*.23+fi*1.1)*.35);if(i==0)c=vec3(M.x*.95,-M.y*.75,.35);\n'+
' float r=.36+.07*sin(fi*3.7)+C*.08;d=smin(d,length(p-c)-r,.42);}return d;}\n'+
'vec3 nor(vec3 p){vec2 e=vec2(.002,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}\n'+
'void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec3 ro=vec3(0,0,4.2),rd=normalize(vec3(uv,-1.5));float t=0.;bool hit=false;\n'+
'for(int i=0;i<90;i++){float h=map(ro+rd*t);if(h<.001){hit=true;break;}t+=h;if(t>9.)break;}\n'+
'vec3 col=BG;if(hit){vec3 p=ro+rd*t;col=shade(nor(p),-rd,T*.03);}gl_FragColor=vec4(col,1.);}';
/* 3 мыльный пузырь */
F[2]='void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec3 ro=vec3(M.x*.3,-M.y*.3,3.2),rd=normalize(vec3(uv,-1.5));\n'+
'float rad=.8+.015*sin(T*1.4)+C*.05;float b=dot(ro,rd),c=dot(ro,ro)-rad*rad,h=b*b-c;vec3 col=BG;\n'+
'col+=pal(T*.02)*exp(-length(uv)*3.)*.06;\n'+
'if(h>0.){float t=-b-sqrt(h);vec3 p=ro+rd*t,n=normalize(p),v=-rd;float fr=pow(1.-max(dot(n,v),0.),2.);\n'+
' vec3 q=n*1.6;q.xz*=r2(T*.15);float sw=fbm(q+vec3(0.,T*.18,0.)+C);\n'+
' vec3 film=pal(sw*1.8+n.y*.3+T*.03);vec3 r=reflect(-v,n);\n'+
' float win=smoothstep(.07,0.,abs(r.x+.42))*smoothstep(.22,.05,abs(r.y-.5))+smoothstep(.04,0.,abs(r.x+.25))*smoothstep(.2,.05,abs(r.y-.5))*.6;\n'+
' float sp=pow(max(dot(r,normalize(vec3(.5,-.4,.8))),0.),60.);\n'+
' float a=.18+fr*.82;col=mix(col,film*(.25+fr*1.1),a)+vec3(1.)*(win*.85+sp*.5);}\n'+
'gl_FragColor=vec4(col,1.);}';
/* 4 галактика */
F[3]='void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec2 g=uv;g.y*=1.4+M.y*.35;g*=r2(T*.04+M.x*.4+C*.6);\n'+
'float r=length(g),a=atan(g.y,g.x);\n'+
'float arms=pow(.5+.5*cos(2.*a-log(r+.002)*5.2+T*.22),2.6);\n'+
'float dens=arms*exp(-r*2.7)*(.55+.9*fbm2(g*5.+T*.04))+exp(-r*4.)*.25;\n'+
'vec3 c=pal(r*1.1+.1+arms*.15);vec3 col=BG+c*dens*1.25+vec3(.9,.97,1.)*exp(-r*11.)*1.2;\n'+
'vec2 q=floor(gl_FragCoord.xy/2.);float s=hs(q);col+=step(.9965,s)*(.4+.6*sin(T*2.+s*80.))*vec3(.9,.95,1.);\n'+
'gl_FragColor=vec4(col,1.);}';
/* 5 океан света */
F[4]='void main(){vec2 uv=gl_FragCoord.xy/R;vec3 col=BG;float hor=.66;\n'+
'for(int k=0;k<46;k++){float fk=float(k)/45.;float z=mix(1.,10.,fk*fk);float x=(uv.x-.5)*z*1.25+M.x*.6;\n'+
' float h=.42*sin(x*1.05+T*.55+z*.33)+.24*sin(x*2.2-T*.42+z*.71)+.1*sin(x*4.3-T*.8+z)+C*.4*sin(x*3.-T*6.);\n'+
' float y=hor-(.5-h*.18)/z+M.y*.02;float th=.0016+.0042/z;float d=abs(uv.y-y);\n'+
' vec3 c=pal(fk*.55+x*.02+T*.02);float fade=1.-fk*.75;\n'+
' col+=c*(1.-smoothstep(0.,th,d))*fade*.95+c*exp(-d*260.*z/4.)*fade*.05;}\n'+
'col+=pal(.3)*exp(-abs(uv.y-hor)*30.)*.05;gl_FragColor=vec4(col,1.);}';
/* 6 цветная сфера */
F[5]='void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;float rr=length(uv-M*vec2(.04,-.04));\n'+
'vec2 p=uv*2.4+M*.25;vec2 q=vec2(fbm2(p+T*.05),fbm2(p+vec2(5.2,1.3)-T*.04));\n'+
'vec2 w=vec2(fbm2(p+3.*q+vec2(1.7,9.2)+T*.06),fbm2(p+3.*q+vec2(8.3,2.8)-T*.05+C));float f=fbm2(p+3.*w);\n'+
'vec3 c=pal(f*1.4+w.x*.5+T*.02)*(.55+.75*w.y);\n'+
'float rad=.36;float m=1.-smoothstep(rad-.006,rad,rr);float z=sqrt(max(0.,1.-pow(rr/rad,2.)));\n'+
'vec3 sp=vec3(1.)*pow(max(0.,dot(normalize(vec3(uv/rad,z)),normalize(vec3(-.5,.6,.65)))),40.)*.6;\n'+
'vec3 col=BG+pal(T*.03)*exp(-rr*5.)*.12;col=mix(col,c*(.45+.55*z)+sp+pow(1.-z,3.)*c*.8,m);\n'+
'col+=(hs(gl_FragCoord.xy+T)-.5)*.03;gl_FragColor=vec4(col,1.);}';
/* 7 призма */
F[6]='float tri(vec2 p,float r){const float k=1.7320508;p.x=abs(p.x)-r;p.y=p.y+r/k;if(p.x+k*p.y>0.)p=vec2(p.x-k*p.y,-k*p.x-p.y)/2.;p.x-=clamp(p.x,-2.*r,0.);return -length(p)*sign(p.y);}\n'+
'float seg(vec2 p,vec2 a,vec2 b){vec2 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h);}\n'+
'void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec3 col=BG+pal(T*.02)*exp(-length(uv)*3.)*.05;float ang=2.6+M.x*.12+sin(T*.35)*.05;\n'+
'vec2 pc=vec2(-.02,.06);vec2 pp=(uv-pc)*r2(ang);float d=tri(pp,.2);\n'+
'vec2 A=vec2(-.62,.62),B=vec2(-.12,.12);float bd=seg(uv,A,B);col+=vec3(1.)*(1.-smoothstep(.0,.0055,bd))*.75+vec3(.8,.9,1.)*exp(-bd*45.)*.2;\n'+
'vec2 E=vec2(.07,-.04);vec2 e=uv-E;float an=atan(e.y,e.x);float a0=-1.32+M.y*.1+sin(T*.5)*.03,a1=-.62+M.y*.1+sin(T*.4)*.03+C*.15;\n'+
'{float t=(an-a0)/(a1-a0);float fan=smoothstep(0.,.1,t)*smoothstep(1.,.9,t)*step(0.,dot(e,vec2(.5,-.86)));\n'+
' vec3 sc=pal(t*.75);float fall=exp(-length(e)*1.3);col+=sc*fan*fall*.9+sc*fan*.05;}\n'+
'float m=1.-smoothstep(-.002,.004,d);float face=smoothstep(-.2,0.,d);\n'+
'vec3 glass=vec3(.07,.1,.14)+pal(pp.y*1.4+pp.x*.6+T*.04)*(.1+.18*face)+vec3(.7,.85,1.)*pow(face,6.)*.35;\n'+
'col=mix(col,glass,m*.9);col+=vec3(.75,.9,1.)*exp(-abs(d)*90.)*.12;gl_FragColor=vec4(col,1.);}';
/* 8 чернила */
F[7]='void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec2 p=uv*2.1;p+=M*.3;\n'+
'vec2 q=vec2(fbm2(p+T*.035),fbm2(p+vec2(5.2,1.3)+T*.03));vec2 w=vec2(fbm2(p+4.*q+vec2(1.7,9.2)-T*.04+C),fbm2(p+4.*q+vec2(8.3,2.8)+T*.05));\n'+
'float f=fbm2(p+4.*w);float ink=pow(smoothstep(.28,.85,f),1.25)*smoothstep(.78,.12,length(uv));\n'+
'vec3 c=pal(w.x*1.2+q.y*.6+T*.015);vec3 col=BG+c*ink*1.9+vec3(1.)*pow(ink,5.)*.35;gl_FragColor=vec4(col,1.);}';
/* 9 кристалл */
F[8]='float map(vec3 p){p.xz*=r2(T*.35+M.x*1.2+C*4.);p.yz*=r2(.35-M.y*.6);p.y*=.8;p=abs(p);float o=(p.x+p.y+p.z-.82)*.57735;float c=max(p.x,max(p.y,p.z))-.52;return max(o,c);}\n'+
'vec3 nor(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(map(p+e.xyy)-map(p-e.xyy),map(p+e.yxy)-map(p-e.yxy),map(p+e.yyx)-map(p-e.yyx)));}\n'+
'void main(){vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;vec3 ro=vec3(0,0,4.),rd=normalize(vec3(uv,-1.5));float t=0.;bool hit=false;\n'+
'for(int i=0;i<80;i++){float h=map(ro+rd*t);if(h<.0008){hit=true;break;}t+=h;if(t>8.)break;}\n'+
'vec3 col=BG+pal(T*.03)*exp(-length(uv)*4.)*.08;\n'+
'if(hit){vec3 p=ro+rd*t,n=nor(p),v=-rd;vec3 L=normalize(vec3(-.5,.8,.6));float df=max(dot(n,L),0.),fr=pow(1.-max(dot(n,v),0.),1.5);\n'+
' float sp=pow(max(dot(reflect(-L,n),v),0.),40.);vec3 f=pal(dot(n,vec3(.3,.8,.5))*.9+T*.04);\n'+
' vec3 rf=reflect(-v,n);vec3 env=pal(rf.y*.8+rf.x*.4+T*.05);col=vec3(.04,.05,.08)+f*(.18+.45*df)+env*(.25+fr*.75)+vec3(1.)*sp*1.1;}gl_FragColor=vec4(col,1.);}';

function glTile(i,cap){
  var box=document.getElementById('b'+i),cv=box.querySelector('canvas'),gl=cv.getContext('webgl',{antialias:false});
  if(!gl)return;
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error('tile '+(i+1)+': '+gl.getShaderInfoLog(o));return o}
  var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,PRE+'\n'+F[i]));gl.linkProgram(pr);gl.useProgram(pr);
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  var U={R:gl.getUniformLocation(pr,'R'),T:gl.getUniformLocation(pr,'T'),C:gl.getUniformLocation(pr,'C'),M:gl.getUniformLocation(pr,'M')};
  var st=hook(box);
  function size(){var d=Math.min(devicePixelRatio||1,cap),s=box.clientWidth;cv.width=s*d;cv.height=s*d;gl.viewport(0,0,cv.width,cv.height)}
  size();addEventListener('resize',size);
  st.draw=function(t){gl.uniform2f(U.R,cv.width,cv.height);gl.uniform1f(U.T,t);gl.uniform1f(U.C,st.c);gl.uniform2f(U.M,st.cx,st.cy);gl.drawArrays(gl.TRIANGLES,0,3)};
}
var tiles=[];
function hook(box){
  var st={mx:0,my:0,cx:0,cy:0,c:0,vis:false,draw:null};
  box.addEventListener('pointermove',function(e){var r=box.getBoundingClientRect();st.mx=(e.clientX-r.left)/r.width*2-1;st.my=(e.clientY-r.top)/r.height*2-1});
  box.addEventListener('pointerleave',function(){st.mx=0;st.my=0});
  box.addEventListener('click',function(){st.c=1});
  new IntersectionObserver(function(es){st.vis=es[0].isIntersecting},{rootMargin:'100px'}).observe(box);
  tiles.push(st);return st;
}
[1.25,1,1,1.25,1.25,1.25,1.25,1.25,1].forEach(function(cap,i){glTile(i,cap)});

/* 10 поток частиц */
(function(){
  var box=document.getElementById('b9'),cv=box.querySelector('canvas'),x=cv.getContext('2d'),st=hook(box),W,H,P=[],N=1300;
  var C=[[0,212,255],[140,123,255],[255,122,224],[92,255,200]],col=[];
  for(var k=0;k<64;k++){var t=k/64*4,a=Math.floor(t)%4,b=(a+1)%4,f=t-Math.floor(t);col.push('rgba('+C.map(function(_,j){return 0}).slice(0,0)+[0,1,2].map(function(j){return Math.round(C[a][j]+(C[b][j]-C[a][j])*f)}).join(',')+',.85)')}
  function size(){var d=Math.min(devicePixelRatio||1,1.5);W=cv.width=box.clientWidth*d;H=cv.height=box.clientWidth*d;x.fillStyle='#080B0F';x.fillRect(0,0,W,H)}
  function spawn(p){p.x=Math.random()*W;p.y=Math.random()*H;p.l=60+Math.random()*160;return p}
  size();addEventListener('resize',size);for(var i=0;i<N;i++)P.push(spawn({}));
  st.draw=function(t){
    x.fillStyle='rgba(8,11,15,.045)';x.fillRect(0,0,W,H);x.lineWidth=Math.max(1,W/700);
    var mx=(st.cx*.5+.5)*W,my=(st.cy*.5+.5)*H,act=Math.abs(st.mx)+Math.abs(st.my)>0,boost=1+st.c*4,s=W/600;
    for(var i=0;i<N;i++){var p=P[i],ox=p.x,oy=p.y;
      var a=(Math.sin(p.x/W*5.2+t*.18)+Math.cos(p.y/H*4.6-t*.14)+Math.sin((p.x+p.y)/W*2.3+t*.1))*1.25;
      var vx=Math.cos(a)*1.5*s*boost,vy=Math.sin(a)*1.5*s*boost;
      if(act){var dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy,r=W*.18;if(d2<r*r*4){var k=Math.exp(-d2/(r*r))*3*s;vx+=-dy/Math.sqrt(d2+1)*k;vy+=dx/Math.sqrt(d2+1)*k}}
      p.x+=vx;p.y+=vy;p.l--;
      if(p.l<0||p.x<0||p.x>W||p.y<0||p.y>H){spawn(p);continue}
      x.strokeStyle=col[Math.floor(((p.x/W)*.45+(p.y/H)*.35+t*.02)%1*64)];x.beginPath();x.moveTo(ox,oy);x.lineTo(p.x,p.y);x.stroke();}
  };
})();

var t0=performance.now();
(function f(now){requestAnimationFrame(f);var t=reduce?3:(now-t0)/1000;
  tiles.forEach(function(st){st.cx+=(st.mx-st.cx)*.06;st.cy+=(st.my-st.cy)*.06;st.c=Math.max(0,st.c-.015);if(st.vis&&st.draw)st.draw(t)});
})(t0);
})();
</script>
</body>
</html>
